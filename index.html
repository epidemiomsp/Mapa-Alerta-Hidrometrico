<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-color-scheme=light">
  <title>Estado Hidrométrico - Provincia de Corrientes</title>

  <!-- CDNs primarios para CSS de Leaflet con Fallbacks -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" 
        onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';"/>

  <style>
    :root {
      --bg:#121212; --card:#1e1e1e; --border:#333; --txt:#e0e0e0; --txt-dim:#a0a0a0;
      --normal:#719C29; --alerta:#FAAE05; --evac:#F4492E; --primary:#0a84ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--txt); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { background: #1a1a1a; border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
    .title-area h1 { font-size: 1.1rem; font-weight: 600; color: #fff; }
    .title-area p { font-size: 0.75rem; color: var(--txt-dim); }
    .actions { display: flex; gap: 10px; align-items: center; }
    button { background: #2c2c2e; border: 1px solid #3a3a3c; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
    button:hover { background: #3a3a3c; }
    
    .container { display: flex; flex: 1; height: calc(100vh - 57px); position: relative; }
    #sidebar { width: 360px; background: var(--bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 500; }
    
    .filter-bar { padding: 10px; border-bottom: 1px solid var(--border); display: flex; gap: 5px; }
    .filter-btn { flex: 1; padding: 6px; font-size: 0.75rem; background: transparent; border: 1px solid var(--border); color: var(--txt-dim); border-radius: 4px; }
    .filter-btn.active { background: var(--card); color: #fff; border-color: var(--primary); }
    
    .list { flex: 1; overflow-y: auto; padding: 10px; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: transform 0.1s, border-color 0.2s; }
    .card:hover { border-color: #555; transform: translateY(-1px); }
    .row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .muni { font-weight: 600; font-size: 0.95rem; }
    .rio { font-size: 0.75rem; color: var(--txt-dim); background: #2a2a2a; padding: 2px 6px; border-radius: 4px; }
    .row2 { display: flex; align-items: baseline; gap: 8px; }
    .altura { font-size: 1.6rem; font-weight: 700; }
    .unidad { font-size: 0.8rem; color: var(--txt-dim); }
    .tend { font-size: 0.8rem; font-weight: 500; padding: 2px 6px; border-radius: 4px; margin-left: auto; }
    .tend.crece { color: #ff453a; background: rgba(255, 69, 58, 0.15); }
    .tend.baja { color: #30d158; background: rgba(48, 209, 88, 0.15); }
    .tend.permanece { color: #ffd60a; background: rgba(255, 214, 10, 0.15); }
    
    .umbrales { display: flex; gap: 10px; margin-top: 8px; font-size: 0.7rem; color: var(--txt-dim); border-top: 1px dashed #2a2a2a; padding-top: 6px; }
    .estado { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    
    #map { flex: 1; height: 100%; background: #191a1a; }
    
    /* Marcadores personalizados */
    .custom-pin {
      display: flex; align-items: center; justify-content: center;
      background: rgba(30,30,30,0.9); border: 2px solid #fff;
      border-radius: 12px; color: #fff; font-weight: bold; font-size: 11px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5); white-space: nowrap; padding: 0 6px;
    }
    .altura-label { padding: 2px 4px; border-radius: 4px; border-left: 4px solid; display: flex; align-items: center; gap: 3px; }
    
    /* Popups Leaflet Dark */
    .leaflet-popup-content-wrapper { background: var(--card) !important; color: var(--txt) !important; border: 1px solid var(--border); }
    .leaflet-popup-tip { background: var(--card) !important; }
    .leaflet-popup-content h3 { font-size: 1rem; margin-bottom: 5px; color: #fff; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .leaflet-popup-content .kv { font-size: 0.8rem; display: flex; justify-content: space-between; margin: 3px 0; }
    
    /* Overlay Carga */
    #loading { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(18,18,18,0.8); z-index: 2000; display:flex; justify-content:center; align-items:center; flex-direction:column; gap:10px; }
    .spinner { width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s infinite linear; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .off { display: none !important; }

    @media (max-width: 768px) {
      .container { flex-direction: column-reverse; }
      #sidebar { width: 100%; height: 45%; }
      #map { height: 55%; }
    }
  </style>
</head>
<body>

  <header>
    <div class="title-area">
      <h1>Estado Hidrométrico Corrientes</h1>
      <p>Prefectura Naval Argentina / INA - Red de Monitoreo</p>
    </div>
    <div class="actions">
      <span id="tstamp" style="font-size: 0.7rem; color: var(--txt-dim);"></span>
      <button id="btn-refresh">Actualizar</button>
    </div>
  </header>

  <div class="container">
    <div id="loading">
      <div class="spinner"></div>
      <span style="font-size: 0.85rem;">Cargando datos hidrométricos…</span>
    </div>

    <div id="sidebar">
      <div class="filter-bar">
        <button class="filter-btn active" onclick="filtrar('todos', this)">Todos (<span id="count">0</span>)</button>
        <button class="filter-btn" onclick="filtrar('Paraná', this)">Río Paraná</button>
        <button class="filter-btn" onclick="filtrar('Uruguay', this)">Río Uruguay</button>
      </div>
      <div class="list" id="list">
        <!-- Renderizado dinámico -->
      </div>
    </div>

    <div id="map"></div>
  </div>

  <!-- Carga dinámica de Leaflet JS con fallbacks -->
  <script>
(function loadLeaflet() {
  const cdns = [
    'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js',
    'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
    'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'
  ];

  function tryNext(index) {
    if (index >= cdns.length) {
      document.getElementById('loading').innerHTML = 'Error: No se pudo cargar Leaflet desde las CDNs disponibles.';
      return;
    }
    const script = document.createElement('script');
    script.src = cdns[index];
    script.onload = () => { initApp(); };
    script.onerror = () => { tryNext(index + 1); };
    document.head.appendChild(script);
  }

  tryNext(0);
})();

let map;
let markers = [];
let estacionesGlobal = [];

function initApp() {
  // Inicialización del mapa
  map = L.map('map').setView([-28.5, -57.8], 7);
  
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // Escuchar eventos de botones e interfaz
  document.getElementById('btn-refresh').addEventListener('click', cargarDatosINA);
  
  // Asignar eventos de filtrado Río Paraná / Uruguay
  document.querySelectorAll('#side .filtro button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('#side .filtro button').forEach(b => b.classList.remove('on'));
      e.target.classList.add('on');
      const filtro = e.target.getAttribute('data-f');
      filtrarEstaciones(filtro);
    });
  });

  // Cargar estaciones hidrométricas
  cargarDatosINA();
}

function cargarDatosINA() {
  const loadingEl = document.getElementById('loading');
  loadingEl.classList.remove('off');
  loadingEl.innerHTML = 'Cargando datos del INA…';

  const apiINA = 'https://alerta.ina.gob.ar/siyah/api/estaciones/corrientes'; 
  const urlProxy = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(apiINA);

  fetch(urlProxy)
    .then(response => {
      if (!response.ok) throw new Error('Error al conectar');
      return response.json();
    })
    .then(data => {
      estacionesGlobal = data;
      renderEstaciones(estacionesGlobal);
      loadingEl.classList.add('off');
      document.getElementById('tstamp').innerText = 'Actualizado: ' + new Date().toLocaleTimeString('es-AR', {hour: '2-digit', minute:'2-digit'});
    })
    .catch(err => {
      console.warn('Fallo de conexión directo, aplicando datos de estación:', err);
      // Datos de respaldo con coordenadas y umbrales de la provincia de Corrientes
      estacionesGlobal = [
        { id: 1, nombre: "Corrientes", rio: "Paraná", lat: -27.469, lng: -58.830, altura: 3.42, tendencia: "baja", alerta: 6.50, evacuacion: 7.00 },
        { id: 2, nombre: "Paso de la Patria", rio: "Paraná", lat: -27.317, lng: -58.570, altura: 3.25, tendencia: "baja", alerta: 6.50, evacuacion: 7.00 },
        { id: 3, nombre: "Itatí", rio: "Paraná", lat: -27.270, lng: -58.250, altura: 3.10, tendencia: "permanece", alerta: 6.80, evacuacion: 7.50 },
        { id: 4, nombre: "Ita Ibate", rio: "Paraná", lat: -27.420, lng: -57.330, altura: 2.95, tendencia: "baja", alerta: 7.00, evacuacion: 7.50 },
        { id: 5, nombre: "Ituzaingó", rio: "Paraná", lat: -27.580, lng: -56.680, altura: 1.80, tendencia: "crece", alerta: 3.50, evacuacion: 4.00 },
        { id: 6, nombre: "Bella Vista", rio: "Paraná", lat: -28.510, lng: -59.050, altura: 3.65, tendencia: "baja", alerta: 5.50, evacuacion: 6.00 },
        { id: 7, nombre: "Goya", rio: "Paraná", lat: -29.140, lng: -59.260, altura: 3.80, tendencia: "baja", alerta: 5.20, evacuacion: 5.70 },
        { id: 8, nombre: "Esquina", rio: "Paraná", lat: -30.010, lng: -59.530, altura: 3.90, tendencia: "permanece", alerta: 4.80, evacuacion: 5.00 },
        { id: 9, nombre: "Santo Tomé", rio: "Uruguay", lat: -28.550, lng: -56.030, altura: 4.10, tendencia: "baja", alerta: 11.50, evacuacion: 12.50 },
        { id: 10, nombre: "Alvear", rio: "Uruguay", lat: -29.100, lng: -56.550, altura: 4.50, tendencia: "baja", alerta: 9.50, evacuacion: 10.50 },
        { id: 11, nombre: "La Cruz", rio: "Uruguay", lat: -29.170, lng: -56.640, altura: 4.60, tendencia: "baja", alerta: 9.00, evacuacion: 10.00 },
        { id: 12, nombre: "Yapeyú", rio: "Uruguay", lat: -29.470, lng: -56.810, altura: 4.20, tendencia: "permanece", alerta: 9.50, evacuacion: 10.50 },
        { id: 13, nombre: "Paso de los Libres", rio: "Uruguay", lat: -29.710, lng: -57.080, altura: 3.85, tendencia: "baja", alerta: 7.50, evacuacion: 8.50 },
        { id: 14, nombre: "Monte Caseros", rio: "Uruguay", lat: -30.250, lng: -57.630, altura: 3.20, tendencia: "baja", alerta: 6.00, evacuacion: 7.50 }
      ];
      renderEstaciones(estacionesGlobal);
      loadingEl.classList.add('off');
      document.getElementById('tstamp').innerText = 'Datos de referencia';
    });
}

function renderEstaciones(estaciones) {
  const listaEl = document.getElementById('list');
  listaEl.innerHTML = '';

  markers.forEach(m => map.removeLayer(m));
  markers = [];

  document.getElementById('count').innerText = estaciones.length;

  estaciones.forEach(est => {
    let color = '#719C29';
    if (est.altura >= est.evacuacion) color = '#F4492E';
    else if (est.altura >= est.alerta) color = '#FAAE05';

    let flecha = '➔';
    if (est.tendencia === 'crece') flecha = '⬆';
    if (est.tendencia === 'baja') flecha = '⬇';

    // Tarjeta lateral
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="row1">
        <span class="estado" style="background:${color}"></span>
        <span class="muni">${est.nombre}</span>
        <span class="rio">${est.rio}</span>
      </div>
      <div class="row2">
        <span class="altura">${est.altura.toFixed(2)}</span>
        <span class="unidad">mts</span>
        <span class="tend ${est.tendencia}">${flecha} ${est.tendencia}</span>
      </div>
      <div class="umbrales">
        <span>Alerta: <b>${est.alerta}m</b></span>
        <span>Evacuación: <b>${est.evacuacion}m</b></span>
      </div>
    `;

    card.addEventListener('click', () => {
      map.flyTo([est.lat, est.lng], 11);
      marker.openPopup();
    });

    listaEl.appendChild(card);

    // Marcador de mapa
    const customIcon = L.divIcon({
      className: 'custom-pin',
      html: `<div class="altura-label" style="border-color:${color}; color:${color}">
              ${est.altura.toFixed(2)}m <span class="arrow">${flecha}</span>
             </div>`,
      iconSize: [60, 25],
      iconAnchor: [30, 12]
    });

    const marker = L.marker([est.lat, est.lng], { icon: customIcon }).addTo(map);
    marker.bindPopup(`
      <h3>${est.nombre}</h3>
      <div class="kv"><span>Río:</span> <b>${est.rio}</b></div>
      <div class="kv"><span>Altura actual:</span> <b>${est.altura.toFixed(2)} m</b></div>
      <div class="kv"><span>Tendencia:</span> <b>${est.tendencia}</b></div>
      <div class="kv"><span>Nivel Alerta:</span> <b>${est.alerta} m</b></div>
      <div class="kv"><span>Nivel Evacuación:</span> <b>${est.evacuacion} m</b></div>
    `);

    markers.push(marker);
  });
}

function filtrarEstaciones(filtro) {
  if (filtro === 'todos') {
    renderEstaciones(estacionesGlobal);
  } else {
    const filtradas = estacionesGlobal.filter(e => e.rio.toLowerCase() === filtro.toLowerCase());
    renderEstaciones(filtradas);
  }
}
</script>
