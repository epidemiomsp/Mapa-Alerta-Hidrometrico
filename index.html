<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monitoreo Hidrométrico y Centros de Evacuados - Corrientes</title>

  <!-- CSS Leaflet CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" 
        onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';"/>

  <!-- Chart.js para renderizar los gráficos de evolución del INA -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg:#121212; --card:#1e1e1e; --border:#333; --txt:#e0e0e0; --txt-dim:#a0a0a0;
      --normal:#719C29; --alerta:#FAAE05; --evac:#F4492E; --primary:#0a84ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--txt); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { background: #1a1a1a; border-bottom: 1px solid var(--border); padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; min-height: 50px; }
    .title-area h1 { font-size: 0.95rem; color: #fff; }
    .title-area p { font-size: 0.68rem; color: var(--txt-dim); }
    
    .header-actions { display: flex; gap: 6px; align-items: center; }

    .container { display: flex; flex: 1; position: relative; height: calc(100vh - 50px); overflow: hidden; }
    
    /* Panel Lateral */
    #sidebar { 
      width: 380px; 
      background: var(--bg); 
      border-right: 1px solid var(--border); 
      display: flex; 
      flex-direction: column; 
      z-index: 1500; 
      height: 100%; 
      position: relative;
      transition: margin-left 0.3s ease;
    }

    #sidebar.collapsed { margin-left: -380px; }

    .toggle-sidebar-btn {
      position: absolute; top: 10px; right: -32px; width: 32px; height: 38px;
      background: var(--card); border: 1px solid var(--border); border-left: none;
      color: #fff; border-radius: 0 6px 6px 0; cursor: pointer; z-index: 1600;
      display: flex; align-items: center; justify-content: center; font-size: 0.9rem;
      box-shadow: 2px 0 8px rgba(0,0,0,0.4);
    }
    
    .tab-bar { display: flex; border-bottom: 1px solid var(--border); background: #181818; }
    .tab-btn { flex: 1; padding: 10px 2px; font-size: 0.7rem; background: transparent; border: none; color: var(--txt-dim); cursor: pointer; border-bottom: 2px solid transparent; text-align: center; white-space: nowrap; }
    .tab-btn.active { color: #fff; border-bottom-color: var(--primary); background: var(--card); font-weight: bold; }
    
    .filter-bar { padding: 6px; border-bottom: 1px solid var(--border); display: flex; gap: 4px; background: var(--bg); }
    .filter-btn { flex: 1; padding: 4px; font-size: 0.7rem; background: transparent; border: 1px solid var(--border); color: var(--txt-dim); border-radius: 4px; cursor: pointer; }
    .filter-btn.active { background: var(--card); color: #fff; border-color: var(--primary); }
    
    .sec-tab { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .list { flex: 1; overflow-y: auto !important; padding: 8px; }
    .list::-webkit-scrollbar { width: 5px; }
    .list::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    
    /* Tarjetas de Ríos */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; cursor: pointer; }
    .card:hover { border-color: #555; }
    .muni { font-weight: 600; font-size: 0.88rem; }
    .rio { font-size: 0.68rem; color: var(--txt-dim); background: #2a2a2a; padding: 2px 6px; border-radius: 4px; }
    .altura { font-size: 1.25rem; font-weight: 700; }

    /* Tarjetas de Centros, Ingresos y Monitoreo */
    .item-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; position: relative; font-size: 0.75rem; }
    .item-card:hover { border-color: #555; }
    .item-title { font-weight: bold; color: #fff; margin-bottom: 2px; font-size: 0.85rem; padding-right: 20px; }
    .item-sub { color: var(--txt-dim); font-size: 0.72rem; margin-top: 2px; }
    .item-badge { display: inline-block; padding: 3px 6px; border-radius: 4px; font-size: 0.68rem; background: #2a2a2a; color: #fff; margin-top: 5px; }
    .btn-delete-card { position: absolute; top: 8px; right: 8px; background: transparent; border: none; color: #ff4d4d; font-size: 0.9rem; cursor: pointer; }
    .btn-delete-card:hover { color: #ff0000; }

    #map { flex: 1; height: 100%; background: #191a1a; width: 100%; z-index: 1; cursor: crosshair; }
    
    .btn-action { background: var(--primary); color: #fff; border: none; padding: 5px 8px; border-radius: 5px; font-size: 0.7rem; cursor: pointer; font-weight: bold; }
    .btn-sec { background:#2c2c2e; border:1px solid #3a3a3c; color:#fff; padding:5px 8px; border-radius:5px; cursor:pointer; font-size: 0.7rem; }

    /* Tooltip para Departamentos */
    .dept-tooltip {
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #0a84ff;
      color: #fff;
      font-weight: bold;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
    }

    /* Modales */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: flex; justify-content: center; align-items: center; z-index: 3000; opacity: 0; pointer-events: none; transition: 0.2s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; width: 460px; max-width: 95%; padding: 15px; max-height: 90vh; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
    .modal-header h3 { font-size: 0.9rem; color: #fff; }
    .close-modal { background: none; border: none; color: var(--txt-dim); font-size: 1.2rem; cursor: pointer; }
    
    .form-group { margin-bottom: 8px; }
    .form-group label { display: block; font-size: 0.7rem; color: var(--txt-dim); margin-bottom: 2px; }
    .form-group input, .form-group select { width: 100%; background: #121212; border: 1px solid var(--border); color: #fff; padding: 6px; border-radius: 4px; font-size: 0.8rem; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary); }
    .form-row-2 { display: flex; gap: 8px; }
    .form-row-2 .form-group { flex: 1; }
    
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

    #loading { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(18,18,18,0.85); z-index: 2000; display:flex; justify-content:center; align-items:center; color: #fff; font-size: 0.9rem; }
    .off { display: none !important; }

    @media (max-width: 768px) {
      .container { flex-direction: column-reverse; }
      #sidebar { width: 100%; height: auto; max-height: 50vh; border-right: none; border-top: 1px solid var(--border); position: absolute; bottom: 0; left: 0; z-index: 1500; box-shadow: 0 -4px 15px rgba(0,0,0,0.5); }
      #sidebar.collapsed { margin-left: 0 !important; }
      #sidebar.collapsed .sec-tab { display: none !important; }
      .toggle-sidebar-btn { position: relative; top: 0; right: 0; width: auto; height: 100%; padding: 0 8px; border-radius: 0; border: none; border-left: 1px solid var(--border); font-size: 0.75rem; background: #252525; }
      .title-area p { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="title-area">
      <h1>Estado Hidrométrico y Sanitario</h1>
      <p>Provincia de Corrientes - Monitoreo de Ríos y Centros de Evacuados</p>
    </div>
    <div class="header-actions">
      <button class="btn-action" onclick="abrirModal('modalCentro')">+ Centro</button>
      <button class="btn-action" style="background:#28a745;" onclick="abrirModal('modalPersona')">+ Persona</button>
      <button class="btn-action" style="background:#17a2b8;" onclick="abrirModal('modalMonitoreo')">+ Monitoreo</button>
      <button class="btn-sec" id="btn-toggle-dptos" onclick="toggleCapaDepartamentos()">🗺️ Dptos</button>
      <button class="btn-sec" onclick="cargarDatosActualizados()">🔄</button>
    </div>
  </header>

  <div class="container">
    <div id="loading" class="off">Cargando datos...</div>

    <div id="sidebar">
      <div class="tab-bar">
        <button class="tab-btn active" id="btn-tab-estaciones" onclick="cambiarPestana('estaciones')">🌊 Ríos</button>
        <button class="tab-btn" id="btn-tab-centros" onclick="cambiarPestana('centros')">🏠 Centros</button>
        <button class="tab-btn" id="btn-tab-ingresos" onclick="cambiarPestana('ingresos')">📋 Ingresos</button>
        <button class="tab-btn" id="btn-tab-monitoreo" onclick="cambiarPestana('monitoreo')">🩺 Monitoreo</button>
        <button class="toggle-sidebar-btn" id="toggleBtn" onclick="toggleSidebar()">◀</button>
      </div>

      <!-- Pestaña 1: Ríos (Paraná y Uruguay) -->
      <div id="sec-estaciones" class="sec-tab">
        <div class="filter-bar">
          <button class="filter-btn active" onclick="filtrar('todos', this)">Todos</button>
          <button class="filter-btn" onclick="filtrar('Paraná', this)">Río Paraná</button>
          <button class="filter-btn" onclick="filtrar('Uruguay', this)">Río Uruguay</button>
        </div>
        <div class="list" id="list-estaciones"></div>
      </div>

      <!-- Pestaña 2: Centros de Evacuados -->
      <div id="sec-centros" class="sec-tab" style="display:none;">
        <div class="list" id="list-centros"></div>
      </div>

      <!-- Pestaña 3: Ingreso de Personas (Hoja 2) -->
      <div id="sec-ingresos" class="sec-tab" style="display:none;">
        <div class="list" id="list-ingresos"></div>
      </div>

      <!-- Pestaña 4: Monitoreo Diario (Hoja 3) -->
      <div id="sec-monitoreo" class="sec-tab" style="display:none;">
        <div class="list" id="list-monitoreo"></div>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <!-- Modal 1: Agregar Centro -->
  <div class="modal-overlay" id="modalCentro">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Nuevo Centro de Evacuados</h3>
        <button class="close-modal" onclick="cerrarModal('modalCentro')">&times;</button>
      </div>
      <form onsubmit="guardarCentro(event)">
        <div class="form-group"><label>Nombre del Centro *</label><input type="text" id="c-nombre" required placeholder="Ej: Hospital Billinghurst"></div>
        <div class="form-group"><label>Municipio / Localidad *</label><input type="text" id="c-muni" required placeholder="Ej: Ituzaingó"></div>
        <div class="form-row-2">
          <div class="form-group"><label>Evacuados Actuales</label><input type="number" id="c-evacuados" value="0" min="0"></div>
          <div class="form-group"><label>Capacidad Máxima</label><input type="number" id="c-capacidad" value="100" min="0"></div>
        </div>
        <div class="form-row-2">
          <div class="form-group"><label>Latitud *</label><input type="number" step="any" id="c-lat" required placeholder="-27.58688"></div>
          <div class="form-group"><label>Longitud *</label><input type="number" step="any" id="c-lng" required placeholder="-56.69061"></div>
        </div>
        <div class="form-group"><label>Teléfono / Responsable</label><input type="text" id="c-contacto" placeholder="Ej: 3624772121"></div>
        <div class="form-row-2">
          <div class="form-group"><label>Baños Operativos</label><input type="number" id="c-banos" value="0"></div>
          <div class="form-group"><label>Litros Agua/Día/Persona</label><input type="number" step="any" id="c-agua" value="0"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-sec" onclick="cerrarModal('modalCentro')">Cancelar</button>
          <button type="submit" class="btn-action">Guardar Centro</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal 2: Ingreso Personas (Hoja 2) -->
  <div class="modal-overlay" id="modalPersona">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Ingreso de Persona (Hoja 2)</h3>
        <button class="close-modal" onclick="cerrarModal('modalPersona')">&times;</button>
      </div>
      <form onsubmit="guardarPersona(event)">
        <div class="form-group">
          <label>Centro de Evacuados *</label>
          <select id="p-centro" required></select>
        </div>
        <div class="form-group"><label>Nombre y Apellido *</label><input type="text" id="p-nombre" required placeholder="Ej: Juan Pérez"></div>
        <div class="form-row-2">
          <div class="form-group"><label>DNI / Documento *</label><input type="text" id="p-dni" required></div>
          <div class="form-group"><label>Fecha de Ingreso</label><input type="date" id="p-fecha"></div>
        </div>
        <div class="form-row-2">
          <div class="form-group"><label>Fecha Nacimiento</label><input type="date" id="p-nac"></div>
          <div class="form-group">
            <label>Sexo</label>
            <select id="p-sexo"><option value="Masculino">Masculino</option><option value="Femenino">Femenino</option><option value="Otro">Otro</option></select>
          </div>
        </div>
        <div class="form-group"><label>Enfermedades Crónicas</label><input type="text" id="p-cronicas" placeholder="Ej: Hipertensión, Diabetes"></div>
        <div class="form-group"><label>Síntomas al Ingreso</label><input type="text" id="p-sintomas" placeholder="Ej: Fiebre, Tos, Ninguno"></div>
        <div class="form-actions">
          <button type="button" class="btn-sec" onclick="cerrarModal('modalPersona')">Cancelar</button>
          <button type="submit" class="btn-action" style="background:#28a745;">Registrar Ingreso</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal 3: Monitoreo Diario (Hoja 3) -->
  <div class="modal-overlay" id="modalMonitoreo">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Registro Monitoreo Diario (Hoja 3)</h3>
        <button class="close-modal" onclick="cerrarModal('modalMonitoreo')">&times;</button>
      </div>
      <form onsubmit="guardarMonitoreo(event)">
        <div class="form-group">
          <label>Centro de Evacuados *</label>
          <select id="m-centro" required></select>
        </div>
        <div class="form-group"><label>Nombre y Apellido *</label><input type="text" id="m-nombre" required></div>
        <div class="form-row-2">
          <div class="form-group"><label>DNI *</label><input type="text" id="m-dni" required></div>
          <div class="form-group"><label>Edad</label><input type="number" id="m-edad"></div>
        </div>
        <div class="form-row-2">
          <div class="form-group">
            <label>¿Embarazada?</label>
            <select id="m-embarazada"><option value="NO">NO</option><option value="SI">SI</option></select>
          </div>
          <div class="form-group">
            <label>¿Discapacidad?</label>
            <select id="m-discapacidad"><option value="NO">NO</option><option value="SI">SI</option></select>
          </div>
        </div>
        <div class="form-group"><label>Medicación Requerida</label><input type="text" id="m-medicacion" placeholder="Ej: Enalapril 10mg"></div>
        <div class="form-group"><label>Síntomas / Observaciones Sanitarias</label><input type="text" id="m-sintomas"></div>
        <div class="form-actions">
          <button type="button" class="btn-sec" onclick="cerrarModal('modalMonitoreo')">Cancelar</button>
          <button type="submit" class="btn-action" style="background:#17a2b8;">Guardar Monitoreo</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal 4: Gráfica de Evolución Hidrométrica (INA) -->
  <div class="modal-overlay" id="modalGrafico">
    <div class="modal-box" style="width: 600px;">
      <div class="modal-header">
        <h3 id="grafico-titulo">Evolución Hidrométrica</h3>
        <button class="close-modal" onclick="cerrarModal('modalGrafico')">&times;</button>
      </div>
      <div id="chartContainer" style="position: relative; height: 300px; width: 100%;">
        <canvas id="chartEvolucion"></canvas>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-sec" onclick="cerrarModal('modalGrafico')">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

    let capaDepartamentos = null;

    function initApp() {
      map = L.map('map').setView([-28.5, -57.8], 7);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

      map.on('click', function(e) {
        const lat = e.latlng.lat.toFixed(5);
        const lng = e.latlng.lng.toFixed(5);
        if (tempMarker) map.removeLayer(tempMarker);
        tempMarker = L.marker([lat, lng]).addTo(map);
        document.getElementById('c-lat').value = lat;
        document.getElementById('c-lng').value = lng;
        abrirModal('modalCentro');
      });

      cargarEstaciones();
      cargarDatosActualizados();
      cargarDepartamentos();
      actualizarTextoBoton();
    }

    function cargarDepartamentos() {
      capaDepartamentos = L.geoJSON(departamentosCorrientesGeoJSON, {
        style: function(feature) {
          return {
            color: '#0a84ff',
            weight: 2,
            opacity: 0.9,
            fillColor: '#0a84ff',
            fillOpacity: 0.12
          };
        },
        onEachFeature: function(feature, layer) {
          const nombreDpto = feature.properties.nombre;
          
          layer.bindTooltip(`Dpto. ${nombreDpto}`, {
            permanent: false,
            direction: 'center',
            className: 'dept-tooltip'
          });

          layer.on({
            mouseover: function(e) {
              const l = e.target;
              l.setStyle({
                weight: 3.5,
                color: '#5ac8fa',
                fillOpacity: 0.3
              });
            },
            mouseout: function(e) {
              capaDepartamentos.resetStyle(e.target);
            }
          });
        }
      });

      capaDepartamentos.addTo(map);
      departamentosVisibles = true;
      actualizarEstiloBotonDptos();
    }

    function toggleCapaDepartamentos() {
      if (!capaDepartamentos) return;

      if (departamentosVisibles) {
        map.removeLayer(capaDepartamentos);
        departamentosVisibles = false;
      } else {
        map.addLayer(capaDepartamentos);
        departamentosVisibles = true;
      }
      actualizarEstiloBotonDptos();
    }

    function actualizarEstiloBotonDptos() {
      const btn = document.getElementById('btn-toggle-dptos');
      if (btn) {
        btn.style.background = departamentosVisibles ? '#0a84ff' : '#2c2c2e';
        btn.style.borderColor = departamentosVisibles ? '#005bb5' : '#3a3a3c';
      }
    }

    function cargarDatosActualizados() {
      document.getElementById('loading').classList.remove('off');
      fetch(APPS_SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          centrosData = data.centros || [];
          personasData = data.personas || [];
          monitoreoData = data.monitoreos || [];
          
          actualizarSelectsCentros();
          renderCentros(centrosData);
          renderIngresos(personasData);
          renderMonitoreo(monitoreoData);
        })
        .catch(err => console.error("Error al cargar backend:", err))
        .finally(() => document.getElementById('loading').classList.add('off'));
    }

    function actualizarSelectsCentros() {
      const selects = [document.getElementById('p-centro'), document.getElementById('m-centro')];
      selects.forEach(s => {
        if (centrosData.length > 0) {
          s.innerHTML = centrosData.map(c => `<option value="${c.id}">${c.nombre} (${c.municipio})</option>`).join('');
        } else {
          s.innerHTML = '<option value="">Sin centros registrados</option>';
        }
      });
    }

    function cambiarPestana(pestana) {
      const sidebar = document.getElementById('sidebar');
      if (sidebar.classList.contains('collapsed')) {
        sidebar.classList.remove('collapsed');
        actualizarTextoBoton();
      }

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.sec-tab').forEach(s => s.style.display = 'none');

      document.getElementById(`btn-tab-${pestana}`).classList.add('active');
      document.getElementById(`sec-${pestana}`).style.display = 'flex';
    }

    function abrirModal(id) { document.getElementById(id).classList.add('active'); }
    function cerrarModal(id) { 
      document.getElementById(id).classList.remove('active');
      if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
    }

      e.preventDefault();
      const nuevo = {
        id: Date.now(),
        nombre: document.getElementById('c-nombre').value,
        municipio: document.getElementById('c-muni').value,
        evacuados: parseInt(document.getElementById('c-evacuados').value)||0,
        capacidad: parseInt(document.getElementById('c-capacidad').value)||0,
        lat: parseFloat(document.getElementById('c-lat').value),
        lng: parseFloat(document.getElementById('c-lng').value),
        contacto: document.getElementById('c-contacto').value || "Sin dato",
        banos: parseInt(document.getElementById('c-banos').value)||0,
        agua: parseFloat(document.getElementById('c-agua').value)||0
      };
      cerrarModal('modalCentro');
      enviarAData(nuevo, "centros");
    }

        nombreApellido: document.getElementById('p-nombre').value,

    function guardarMonitoreo(e) {
      e.preventDefault();
      const nuevoM = {
        action: "add_monitoreo",
        idCentro: document.getElementById('m-centro').value,
        nombreApellido: document.getElementById('m-nombre').value,
        dni: document.getElementById('m-dni').value,
        edad: document.getElementById('m-edad').value,
        embarazada: document.getElementById('m-embarazada').value,
        discapacidad: document.getElementById('m-discapacidad').value,

    function eliminarCentro(idCentro, event) {
      if (event) event.stopPropagation();
      if (!confirm("¿Confirma que desea eliminar este centro de evacuados?")) return;

      document.getElementById('loading').classList.remove('off');
      fetch(APPS_SCRIPT_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: "delete_centro", id: idCentro })
      })
      .then(() => setTimeout(() => { cargarDatosActualizados(); }, 1200))
      .catch(err => console.error(err));
    }

    function enviarAData(payload, pestanaDestino) {
      document.getElementById('loading').classList.remove('off');
      fetch(APPS_SCRIPT_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => setTimeout(() => { cargarDatosActualizados(); cambiarPestana(pestanaDestino); }, 1200))
      .catch(err => console.error(err));
    }

    function renderEstaciones(estaciones) {
      const listaEl = document.getElementById('list-estaciones');
      listaEl.innerHTML = '';
      markersEstaciones.forEach(m => map.removeLayer(m));
      markersEstaciones = [];

      estaciones.forEach(est => {
        let color = '#719C29';
        if (est.altura >= est.evacuacion) color = '#F4492E';
        else if (est.altura >= est.alerta) color = '#FAAE05';

        let flecha = est.tendencia === 'crece' ? '⬆' : (est.tendencia === 'baja' ? '⬇' : '➔');

        const inaInfo = inaEstacionesIds[est.nombre] || { estacion_id: 15, var_id: 2 };

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between;">
            <span class="muni">${est.nombre}</span>
            <span class="rio">Río ${est.rio}</span>
          </div>
          <div style="display:flex; align-items:baseline; gap:8px; margin-top:4px;">
            <span class="altura">${est.altura.toFixed(2)}</span>
            <span style="font-size:0.8rem; color:var(--txt-dim);">mts</span>
            <span style="margin-left:auto; font-size:0.8rem;">${flecha} ${est.tendencia}</span>
          </div>
          <button onclick="event.stopPropagation(); mostrarGraficoINA('${est.nombre}', ${inaInfo.estacion_id}, ${inaInfo.var_id}, ${est.alerta}, ${est.evacuacion})" 
                  style="margin-top:8px; width:100%; background:#2c2c2e; border:1px solid #444; color:#0a84ff; padding:4px; border-radius:4px; font-size:0.72rem; cursor:pointer; font-weight:bold;">
            📈 Ver Gráfica de Evolución
          </button>
        `;
        card.onclick = () => {
          map.flyTo([est.lat, est.lng], 11);
          if (window.innerWidth <= 768) toggleSidebar();
        };
        listaEl.appendChild(card);

        const customIcon = L.divIcon({
          className: 'custom-pin',
          html: `<div style="background:rgba(30,30,30,0.9); border:2px solid ${color}; color:${color}; padding:2px 6px; border-radius:8px; font-weight:bold; font-size:11px; white-space:nowrap;">${est.nombre}: ${est.altura.toFixed(2)}m ${flecha}</div>`,
          iconSize: [80, 25]
        });

        const marker = L.marker([est.lat, est.lng], { icon: customIcon }).addTo(map);
        marker.bindPopup(`
          <div style="color:#000;">
            <b>${est.nombre}</b><br>Río: ${est.rio}<br>Altura actual: ${est.altura.toFixed(2)}m<br>Alerta: ${est.alerta}m | Evacuación: ${est.evacuacion}m<br><br>
            <button onclick="mostrarGraficoINA('${est.nombre}', ${inaInfo.estacion_id}, ${inaInfo.var_id}, ${est.alerta}, ${est.evacuacion})" 
                    style="background:#0a84ff; color:#fff; border:none; padding:5px 8px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:0.75rem;">
              📈 Ver Gráfica de Evolución
            </button>
          </div>
        `);
        markersEstaciones.push(marker);
      });
    }

    function prepararCanvasGrafico() {
      const container = document.getElementById('chartContainer');
      container.innerHTML = '<canvas id="chartEvolucion"></canvas>';
      return document.getElementById('chartEvolucion').getContext('2d');
    }

    function mostrarGraficoINA(nombreEstacion, idEstacion, idVar, nivelAlerta, nivelEvac) {
      document.getElementById('grafico-titulo').innerText = `Evolución Hidrométrica - ${nombreEstacion} (INA)`;
      abrirModal('modalGrafico');

      const ctx = prepararCanvasGrafico();

      const urlTarget = `https://alerta.ina.gob.ar/siyah/api/obs/puntual/series/${idEstacion}/${idVar}/datos`;
      const urlProxy = `https://corsproxy.io/?${encodeURIComponent(urlTarget)}`;

      fetch(urlProxy)
        .then(res => res.json())
        .then(data => {
          if (!Array.isArray(data) || data.length === 0) {
            throw new Error("Formato de datos no válido");
          }

          const lecturas = data.slice(-15);
          const etiquetas = lecturas.map(d => new Date(d.timestart).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit' }));
          const valores = lecturas.map(d => d.valor);

          if (miChart) miChart.destroy();

          miChart = new Chart(ctx, {
            type: 'line',
            data: {
              labels: etiquetas,
              datasets: [
                {
                  label: 'Nivel Hidrométrico (m)',
                  data: valores,
                  borderColor: '#0a84ff',
                  backgroundColor: 'rgba(10, 132, 255, 0.1)',
                  fill: true,
                  tension: 0.3
                },
                {
                  label: 'Nivel Alerta',
                  data: Array(valores.length).fill(nivelAlerta),
                  borderColor: '#FAAE05',
                  borderDash: [5, 5],
                  pointRadius: 0,
                  fill: false
                },
                {
                  label: 'Nivel Evacuación',
                  data: Array(valores.length).fill(nivelEvac),
                  borderColor: '#F4492E',
                  borderDash: [5, 5],
                  pointRadius: 0,
                  fill: false
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                y: { beginAtZero: false, grid: { color: '#333' }, ticks: { color: '#fff' } },
                x: { grid: { color: '#333' }, ticks: { color: '#fff' } }
              },
              plugins: { legend: { labels: { color: '#fff' } } }
            }
          });
        })
        .catch(err => {
          console.warn("No se pudieron cargar datos en vivo del INA, cargando gráfico de respaldo:", err);
          renderGraficoEjemplo(nombreEstacion, nivelAlerta, nivelEvac);
        });
    }

    function renderGraficoEjemplo(nombreEstacion, nivelAlerta, nivelEvac) {
      const ctx = prepararCanvasGrafico();
      if (miChart) miChart.destroy();

      const etiquetas = ['1 Ago', '2 Ago', '3 Ago', '4 Ago', '5 Ago', '6 Ago', '7 Ago'];
      const valores = [1.85, 1.72, 1.50, 1.60, 1.68, 1.70, 1.55];

      miChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: etiquetas,
          datasets: [
            {
              label: 'Nivel (m)',
              data: valores,
              borderColor: '#0a84ff',
              backgroundColor: 'rgba(10, 132, 255, 0.1)',
              fill: true,
              tension: 0.3
            },
            {
              label: 'Alerta',
              data: Array(7).fill(nivelAlerta),
              borderColor: '#FAAE05',
              borderDash: [5, 5],
              pointRadius: 0
            },
            {
              label: 'Evacuación',
              data: Array(7).fill(nivelEvac),
              borderColor: '#F4492E',
              borderDash: [5, 5],
              pointRadius: 0
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { grid: { color: '#333' }, ticks: { color: '#fff' } },
            x: { grid: { color: '#333' }, ticks: { color: '#fff' } }
          },
          plugins: { legend: { labels: { color: '#fff' } } }
        }
      });
    }

    function renderCentros(centros) {
      const listEl = document.getElementById('list-centros');
      listEl.innerHTML = '';
      markersCentros.forEach(m => map.removeLayer(m));
      markersCentros = [];

      centros.forEach(c => {
        const pctOcupacion = c.capacidad > 0 ? Math.round((c.evacuados / c.capacidad) * 100) : 0;
        let colorPin = '#0a84ff';
        if (pctOcupacion >= 100) colorPin = '#F4492E';
        else if (pctOcupacion >= 80) colorPin = '#FAAE05';

        const card = document.createElement('div');
        card.className = 'item-card';
        card.style.borderLeft = `4px solid ${colorPin}`;
        card.innerHTML = `
          <button class="btn-delete-card" onclick="eliminarCentro('${c.id}', event)" title="Eliminar Centro">🗑️</button>
          <div class="item-title">🏠 ${c.nombre}</div>
          <div class="item-sub">📍 ${c.municipio} | 📞 ${c.contacto}</div>
          <div class="item-badge">Evacuados: ${c.evacuados} / ${c.capacidad} (${pctOcupacion}%)</div>
        `;
        card.onclick = () => {
          map.flyTo([c.lat, c.lng], 13);
          if (window.innerWidth <= 768) toggleSidebar();
        };
        listEl.appendChild(card);

        const iconoCasa = L.divIcon({
          className: 'custom-house-pin',
          html: `<div style="background:${colorPin}; color:#fff; padding:3px 8px; border-radius:12px; font-weight:bold; font-size:11px; border:2px solid #fff; white-space:nowrap; box-shadow:0 2px 5px rgba(0,0,0,0.4);">🏠 ${c.evacuados} evac.</div>`,
          iconSize: [85, 25]
        });

        const marker = L.marker([c.lat, c.lng], { icon: iconoCasa }).addTo(map);
        marker.bindPopup(`
          <div style="color:#000;">
            <b style="font-size:0.95rem;">${c.nombre}</b><br>
            <b>Municipio:</b> ${c.municipio}<br>
            <b>Evacuados:</b> ${c.evacuados} / ${c.capacidad} (${pctOcupacion}%)<br>
            <b>Contacto:</b> ${c.contacto}<br>
            <b>Baños:</b> ${c.banos || 0} | <b>Agua:</b> ${c.agua || 0} L/día/p<br><br>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:5px;">
              <button onclick="verEvacuadosCentro('${c.id}')" style="background:#0a84ff; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:0.75rem;">👥 Evacuados</button>
              <button onclick="eliminarCentro('${c.id}')" title="Eliminar Centro" style="background:#d9534f; color:#fff; border:none; padding:5px 8px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:0.85rem;">🗑️</button>
            </div>
          </div>
        `);
        markersCentros.push(marker);
      });
    }

    function verEvacuadosCentro(idCentro) {
      cambiarPestana('ingresos');
      const filtrados = personasData.filter(p => String(p.idCentro) === String(idCentro));
      renderIngresos(filtrados);
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('collapsed');
      actualizarTextoBoton();
      setTimeout(() => map.invalidateSize(), 300);
    }

    function actualizarTextoBoton() {
      const sidebar = document.getElementById('sidebar');
      const toggleBtn = document.getElementById('toggleBtn');
      const isMobile = window.innerWidth <= 768;
      const isCollapsed = sidebar.classList.contains('collapsed');

      if (isMobile) {
        toggleBtn.innerHTML = isCollapsed ? '▲ Lista' : '▼ Ocultar';
      } else {
        toggleBtn.innerHTML = isCollapsed ? '▶' : '◀';
      }
    }

    function filtrar(rio, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (rio === 'todos') renderEstaciones(estacionesData);
      else renderEstaciones(estacionesData.filter(e => e.rio.toLowerCase().includes(rio.toLowerCase())));
    }

    window.onresize = actualizarTextoBoton;
    window.onload = initApp;
  </script>
</body>
</html>
