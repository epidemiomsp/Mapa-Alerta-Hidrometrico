<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Estado Hidrométrico y Centros de Evacuados - Corrientes</title>

  <!-- CSS Leaflet con fallback CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" 
        onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';"/>

  <style>
    :root {
      --bg:#121212; --card:#1e1e1e; --border:#333; --txt:#e0e0e0; --txt-dim:#a0a0a0;
      --normal:#719C29; --alerta:#FAAE05; --evac:#F4492E; --primary:#0a84ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--txt); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { background: #1a1a1a; border-bottom: 1px solid var(--border); padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; min-height: 50px; }
    .title-area h1 { font-size: 1rem; color: #fff; }
    .title-area p { font-size: 0.7rem; color: var(--txt-dim); }
    
    .header-actions { display: flex; gap: 8px; align-items: center; }

    .container { display: flex; flex: 1; position: relative; height: calc(100vh - 50px); overflow: hidden; }
    
    /* Panel Lateral (Escritorio) */
    #sidebar { 
      width: 360px; 
      background: var(--bg); 
      border-right: 1px solid var(--border); 
      display: flex; 
      flex-direction: column; 
      z-index: 1500; 
      height: 100%; 
      position: relative;
      transition: margin-left 0.3s ease;
    }

    #sidebar.collapsed {
      margin-left: -360px;
    }

    /* Botón para Escritorio */
    .toggle-sidebar-btn {
      position: absolute;
      top: 12px;
      right: -36px;
      width: 36px;
      height: 40px;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: none;
      color: #fff;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      z-index: 1600;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: 2px 0 8px rgba(0,0,0,0.4);
    }
    
    /* Pestañas de Navegación */
    .tab-bar { display: flex; border-bottom: 1px solid var(--border); background: #181818; align-items: center; }
    .tab-btn { flex: 1; padding: 12px 5px; font-size: 0.78rem; background: transparent; border: none; color: var(--txt-dim); cursor: pointer; border-bottom: 2px solid transparent; transition: 0.2s; white-space: nowrap; }
    .tab-btn.active { color: #fff; border-bottom-color: var(--primary); background: var(--card); font-weight: bold; }
    
    .filter-bar { padding: 8px; border-bottom: 1px solid var(--border); display: flex; gap: 5px; background: var(--bg); }
    .filter-btn { flex: 1; padding: 5px; font-size: 0.75rem; background: transparent; border: 1px solid var(--border); color: var(--txt-dim); border-radius: 4px; cursor: pointer; }
    .filter-btn.active { background: var(--card); color: #fff; border-color: var(--primary); }
    
    #sec-estaciones, #sec-centros {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease;
    }

    .list { 
      flex: 1; 
      overflow-y: auto !important; 
      padding: 10px; 
    }

    .list::-webkit-scrollbar { width: 6px; }
    .list::-webkit-scrollbar-track { background: var(--bg); }
    .list::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; cursor: pointer; }
    .card:hover { border-color: #555; }
    .muni { font-weight: 600; font-size: 0.9rem; }
    .rio { font-size: 0.7rem; color: var(--txt-dim); background: #2a2a2a; padding: 2px 6px; border-radius: 4px; }
    .altura { font-size: 1.3rem; font-weight: 700; }
    
    .centro-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; cursor: pointer; border-left: 4px solid var(--primary); }
    .centro-title { font-weight: bold; font-size: 0.85rem; color: #fff; }
    .centro-info { font-size: 0.75rem; color: var(--txt-dim); margin-top: 4px; }
    .centro-stats { display: flex; justify-content: space-between; margin-top: 6px; font-size: 0.7rem; background: #262626; padding: 5px; border-radius: 4px; }
    
    #map { flex: 1; height: 100%; background: #191a1a; width: 100%; z-index: 1; cursor: crosshair; }
    
    .btn-add { background: var(--primary); color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-weight: bold; }
    .btn-refresh { background:#2c2c2e; border:1px solid #3a3a3c; color:#fff; padding:6px 10px; border-radius:6px; cursor:pointer; font-size: 0.75rem; }

    /* Modal Formulario */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 3000; opacity: 0; pointer-events: none; transition: 0.2s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; width: 420px; max-width: 90%; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .modal-header h3 { font-size: 1rem; color: #fff; }
    .close-modal { background: none; border: none; color: var(--txt-dim); font-size: 1.4rem; cursor: pointer; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--txt-dim); margin-bottom: 4px; }
    .form-group input { width: 100%; background: #121212; border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 5px; font-size: 0.85rem; outline: none; }
    .form-group input:focus { border-color: var(--primary); }
    .form-row-2 { display: flex; gap: 10px; }
    .form-row-2 .form-group { flex: 1; }
    
    .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
    .btn-cancel { background: #2c2c2e; border: 1px solid var(--border); color: #fff; padding: 8px 14px; border-radius: 5px; cursor: pointer; }
    .btn-save { background: var(--primary); border: none; color: #fff; padding: 8px 14px; border-radius: 5px; cursor: pointer; font-weight: bold; }

    #loading { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(18,18,18,0.8); z-index: 2000; display:flex; justify-content:center; align-items:center; color: #fff; }
    .off { display: none !important; }

    /* ========================================================
       DISEÑO RESPONSIVE PARA DISPOSITIVOS MÓVILES
       ======================================================== */
    @media (max-width: 768px) {
      .container {
        flex-direction: column-reverse;
      }

      #sidebar {
        width: 100%;
        height: auto;
        max-height: 50vh;
        border-right: none;
        border-top: 1px solid var(--border);
        position: absolute;
        bottom: 0;
        left: 0;
        z-index: 1500;
        box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
      }

      #sidebar.collapsed {
        margin-left: 0 !important;
      }

      #sidebar.collapsed #sec-estaciones,
      #sidebar.collapsed #sec-centros {
        display: none !important;
      }

      .toggle-sidebar-btn {
        position: relative;
        top: 0;
        right: 0;
        width: auto;
        height: 100%;
        padding: 0 10px;
        border-radius: 0;
        border: none;
        border-left: 1px solid var(--border);
        font-size: 0.75rem;
        font-weight: bold;
        background: #252525;
      }

      .title-area p { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="title-area">
      <h1>Estado Hidrométrico y Evacuados</h1>
      <p>Provincia de Corrientes - Monitoreo Sanitario</p>
    </div>
    <div class="header-actions">
      <button class="btn-add" onclick="abrirModalCentros()">+ Centro</button>
      <button class="btn-refresh" onclick="cargarDatosActualizados()">🔄</button>
    </div>
  </header>

  <div class="container">
    <div id="loading" class="off">Cargando datos...</div>

    <div id="sidebar">
      <div class="tab-bar">
        <button class="tab-btn active" id="tab-estaciones-btn" onclick="seleccionarPestana('estaciones')">🌊 Datos</button>
        <button class="tab-btn" id="tab-centros-btn" onclick="seleccionarPestana('centros')">🏠 Evacuados</button>
        <button class="toggle-sidebar-btn" id="toggleBtn" onclick="toggleSidebar()">◀</button>
      </div>

      <!-- Pestaña 1: Datos de Referencia -->
      <div id="sec-estaciones">
        <div class="filter-bar">
          <button class="filter-btn active" onclick="filtrar('todos', this)">Todos</button>
          <button class="filter-btn" onclick="filtrar('Paraná', this)">Río Paraná</button>
          <button class="filter-btn" onclick="filtrar('Uruguay', this)">Río Uruguay</button>
        </div>
        <div class="list" id="list-estaciones"></div>
      </div>

      <!-- Pestaña 2: Centros de Evacuados -->
      <div id="sec-centros" style="display:none;">
        <div class="list" id="list-centros"></div>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <!-- Formulario Modal -->
  <div class="modal-overlay" id="modalCentro">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Cargar Centro de Evacuados</h3>
        <button class="close-modal" onclick="cerrarModalCentros()">&times;</button>
      </div>
      <form id="formNuevoCentro" onsubmit="guardarCentro(event)">
        <div class="form-group">
          <label>Nombre de la Institución / Centro *</label>
          <input type="text" id="c-nombre" placeholder="Ej: Escuela Nº 1 / Polideportivo" required>
        </div>
        <div class="form-group">
          <label>Municipio *</label>
          <input type="text" id="c-muni" placeholder="Ej: Goya, Paso de los Libres" required>
        </div>
        <div class="form-row-2">
          <div class="form-group">
            <label>Evacuados Actuales</label>
            <input type="number" id="c-evacuados" value="0" min="0" required>
          </div>
          <div class="form-group">
            <label>Capacidad Máxima</label>
            <input type="number" id="c-capacidad" value="100" min="0" required>
          </div>
        </div>
        <div class="form-row-2">
          <div class="form-group">
            <label>Latitud *</label>
            <input type="number" step="any" id="c-lat" placeholder="-29.140" required>
          </div>
          <div class="form-group">
            <label>Longitud *</label>
            <input type="number" step="any" id="c-lng" placeholder="-59.260" required>
          </div>
        </div>
        <div class="form-group">
          <label>Teléfono de Contacto / Responsable</label>
          <input type="text" id="c-contacto" placeholder="Ej: 3777-123456">
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="cerrarModalCentros()">Cancelar</button>
          <button type="submit" class="btn-save">Guardar Centro</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script>
    let map;
    let tempMarker = null;
    let markersEstaciones = [];
    let markersCentros = [];
    let estacionesData = [];
    let centrosData = [];

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBQhxZFtdQGh9CptOjw8jl1CTqM0Eei2KZ6rVObkVfXT6XPUHD6IfW2ToWRtrkJUKzFg/exec";

    function initApp() {
      map = L.map('map').setView([-28.5, -57.8], 7);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

      // EVENTO PARA DETECTAR CLIC EN EL MAPA Y EXTRAER COORDENADAS
      map.on('click', function(e) {
        const lat = e.latlng.lat.toFixed(5);
        const lng = e.latlng.lng.toFixed(5);

        // Si había un marcador temporal previo, quitarlo
        if (tempMarker) {
          map.removeLayer(tempMarker);
        }

        // Crear marcador temporal donde se hizo clic
        tempMarker = L.marker([lat, lng]).addTo(map)
          .bindPopup("📍 Ubicación seleccionada para el nuevo centro")
          .openPopup();

        // Cargar lat/lng automáticamente en el formulario
        document.getElementById('c-lat').value = lat;
        document.getElementById('c-lng').value = lng;

        // Abrir ventana emergente
        abrirModalCentros();
      });

      cargarEstaciones();
      cargarCentrosDesdeSheet();
      actualizarTextoBoton();
    }

    function cargarDatosActualizados() {
      cargarEstaciones();
      cargarCentrosDesdeSheet();
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('collapsed');
      actualizarTextoBoton();
      setTimeout(() => { map.invalidateSize(); }, 300);
    }

    function actualizarTextoBoton() {
      const sidebar = document.getElementById('sidebar');
      const toggleBtn = document.getElementById('toggleBtn');
      const isMobile = window.innerWidth <= 768;
      const isCollapsed = sidebar.classList.contains('collapsed');

      if (isMobile) {
        toggleBtn.innerHTML = isCollapsed ? '▲ Lista' : '▼ Ocultar';
      } else {
        toggleBtn.innerHTML = isCollapsed ? '▶' : '◀';
      }
    }

    function seleccionarPestana(pestana) {
      const sidebar = document.getElementById('sidebar');
      if (sidebar.classList.contains('collapsed')) {
        sidebar.classList.remove('collapsed');
        actualizarTextoBoton();
      }

      cambiarPestana(pestana);
    }

    function cambiarPestana(pestana) {
      document.getElementById('tab-estaciones-btn').classList.remove('active');
      document.getElementById('tab-centros-btn').classList.remove('active');

      if (pestana === 'estaciones') {
        document.getElementById('tab-estaciones-btn').classList.add('active');
        document.getElementById('sec-estaciones').style.display = 'flex';
        document.getElementById('sec-centros').style.display = 'none';
      } else {
        document.getElementById('tab-centros-btn').classList.add('active');
        document.getElementById('sec-estaciones').style.display = 'none';
        document.getElementById('sec-centros').style.display = 'flex';
      }
    }

    function abrirModalCentros() {
      document.getElementById('modalCentro').classList.add('active');
    }

    function cerrarModalCentros() {
      document.getElementById('modalCentro').classList.remove('active');
      document.getElementById('formNuevoCentro').reset();
      
      // Quitar marcador temporal si cancela la carga
      if (tempMarker) {
        map.removeLayer(tempMarker);
        tempMarker = null;
      }
    }

    function cargarCentrosDesdeSheet() {
      document.getElementById('loading').classList.remove('off');
      
      fetch(APPS_SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          if (Array.isArray(data)) {
            centrosData = data;
            renderCentros(centrosData);
          }
        })
        .catch(err => console.error("Error al cargar centros desde Google Sheets:", err))
        .finally(() => {
          document.getElementById('loading').classList.add('off');
        });
    }

    function guardarCentro(e) {
      e.preventDefault();

      const nuevoCentro = {
        id: Date.now(),
        nombre: document.getElementById('c-nombre').value,
        municipio: document.getElementById('c-muni').value,
        evacuados: parseInt(document.getElementById('c-evacuados').value) || 0,
        capacidad: parseInt(document.getElementById('c-capacidad').value) || 0,
        lat: parseFloat(document.getElementById('c-lat').value),
        lng: parseFloat(document.getElementById('c-lng').value),
        contacto: document.getElementById('c-contacto').value || "Sin dato"
      };

      // Si había marcador temporal, eliminarlo al guardar
      if (tempMarker) {
        map.removeLayer(tempMarker);
        tempMarker = null;
      }

      centrosData.push(nuevoCentro);
      renderCentros(centrosData);
      cerrarModalCentros();
      seleccionarPestana('centros');
      map.flyTo([nuevoCentro.lat, nuevoCentro.lng], 13);

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(nuevoCentro)
      })
      .then(() => {
        console.log("Registrado con éxito en Google Sheets");
        setTimeout(cargarCentrosDesdeSheet, 1500);
      })
      .catch(err => console.error("Error enviando a la planilla:", err));
    }

    function renderCentros(centros) {
      const listEl = document.getElementById('list-centros');
      listEl.innerHTML = '';

      markersCentros.forEach(m => map.removeLayer(m));
      markersCentros = [];

      centros.forEach(c => {
        const pctOcupacion = c.capacidad > 0 ? Math.round((c.evacuados / c.capacidad) * 100) : 0;
        
        let colorPin = '#0a84ff';
        if (pctOcupacion >= 100) colorPin = '#F4492E';
        else if (pctOcupacion >= 80) colorPin = '#FAAE05';

        const card = document.createElement('div');
        card.className = 'centro-card';
        card.style.borderLeftColor = colorPin;
        card.innerHTML = `
          <div class="centro-title">🏠 ${c.nombre}</div>
          <div class="centro-info">📍 ${c.municipio} | 📞 ${c.contacto}</div>
          <div class="centro-stats">
            <span>Evacuados: <b>${c.evacuados}</b> / ${c.capacidad}</span>
            <span>Ocupación: <b>${pctOcupacion}%</b></span>
          </div>
        `;
        card.onclick = () => {
          map.flyTo([c.lat, c.lng], 13);
          if (window.innerWidth <= 768) toggleSidebar();
        };
        listEl.appendChild(card);

        const iconoCasa = L.divIcon({
          className: 'custom-house-pin',
          html: `<div style="background:${colorPin}; color:#fff; padding:3px 8px; border-radius:12px; font-weight:bold; font-size:11px; border:2px solid #fff; white-space:nowrap; box-shadow:0 2px 5px rgba(0,0,0,0.4);">🏠 ${c.evacuados} evac.</div>`,
          iconSize: [85, 25]
        });

        const marker = L.marker([c.lat, c.lng], { icon: iconoCasa }).addTo(map);
        
        let detalleSalud = '';
        if (c.casosEDA || c.casosFebriIes || c.casosIRA) {
          detalleSalud = `<hr style="margin:5px 0; border:0; border-top:1px solid #ccc;">
            <b style="color:#d9534f;">Atenciones Sanitarias:</b><br>
            - Fiebre: ${c.casosFebriIes || 0}<br>
            - Diarrea (EDA): ${c.casosEDA || 0}<br>
            - Respiratorio (IRA): ${c.casosIRA || 0}`;
        }

        marker.bindPopup(`
          <div style="color:#000;">
            <b style="font-size:0.95rem;">${c.nombre}</b><br>
            <b>Municipio:</b> ${c.municipio}<br>
            <b>Evacuados:</b> ${c.evacuados} / ${c.capacidad} (${pctOcupacion}%)<br>
            <b>Contacto:</b> ${c.contacto}
            ${detalleSalud}
          </div>
        `);
        markersCentros.push(marker);
      });
    }

    function cargarEstaciones() {
      estacionesData = [
        { id: 1, nombre: "Corrientes", rio: "Paraná", lat: -27.469, lng: -58.830, altura: 3.42, tendencia: "baja", alerta: 6.50, evacuacion: 7.00 },
        { id: 2, nombre: "Paso de la Patria", rio: "Paraná", lat: -27.317, lng: -58.570, altura: 3.25, tendencia: "baja", alerta: 6.50, evacuacion: 7.00 },
        { id: 3, nombre: "Itatí", rio: "Paraná", lat: -27.270, lng: -58.250, altura: 3.10, tendencia: "permanece", alerta: 6.80, evacuacion: 7.50 },
        { id: 4, nombre: "Ita Ibate", rio: "Paraná", lat: -27.420, lng: -57.330, altura: 2.95, tendencia: "baja", alerta: 7.00, evacuacion: 7.50 },
        { id: 5, nombre: "Ituzaingó", rio: "Paraná", lat: -27.580, lng: -56.680, altura: 1.80, tendencia: "crece", alerta: 3.50, evacuacion: 4.00 },
        { id: 6, nombre: "Bella Vista", rio: "Paraná", lat: -28.510, lng: -59.050, altura: 3.65, tendencia: "baja", alerta: 5.50, evacuacion: 6.00 },
        { id: 7, nombre: "Goya", rio: "Paraná", lat: -29.140, lng: -59.260, altura: 3.80, tendencia: "baja", alerta: 5.20, evacuacion: 5.70 },
        { id: 8, nombre: "Esquina", rio: "Paraná", lat: -30.010, lng: -59.530, altura: 3.90, tendencia: "permanece", alerta: 4.80, evacuacion: 5.00 },
        { id: 9, nombre: "Santo Tomé", rio: "Uruguay", lat: -28.550, lng: -56.030, altura: 4.10, tendencia: "baja", alerta: 11.50, evacuacion: 12.50 },
        { id: 10, nombre: "Alvear", rio: "Uruguay", lat: -29.100, lng: -56.550, altura: 4.50, tendencia: "baja", alerta: 9.50, evacuacion: 10.50 },
        { id: 11, nombre: "La Cruz", rio: "Uruguay", lat: -29.170, lng: -56.640, altura: 4.60, tendencia: "baja", alerta: 9.00, evacuacion: 10.00 },
        { id: 12, nombre: "Yapeyú", rio: "Uruguay", lat: -29.470, lng: -56.810, altura: 4.20, tendencia: "permanece", alerta: 9.50, evacuacion: 10.50 },
        { id: 13, nombre: "Paso de los Libres", rio: "Uruguay", lat: -29.710, lng: -57.080, altura: 3.85, tendencia: "baja", alerta: 7.50, evacuacion: 8.50 },
        { id: 14, nombre: "Monte Caseros", rio: "Uruguay", lat: -30.250, lng: -57.630, altura: 3.20, tendencia: "baja", alerta: 6.00, evacuacion: 7.50 }
      ];
      renderEstaciones(estacionesData);
    }

    function renderEstaciones(estaciones) {
      const listaEl = document.getElementById('list-estaciones');
      listaEl.innerHTML = '';
      markersEstaciones.forEach(m => map.removeLayer(m));
      markersEstaciones = [];

      estaciones.forEach(est => {
        let color = '#719C29';
        if (est.altura >= est.evacuacion) color = '#F4492E';
        else if (est.altura >= est.alerta) color = '#FAAE05';

        let flecha = est.tendencia === 'crece' ? '⬆' : (est.tendencia === 'baja' ? '⬇' : '➔');

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between;">
            <span class="muni">${est.nombre}</span>
            <span class="rio">${est.rio}</span>
          </div>
          <div style="display:flex; align-items:baseline; gap:8px; margin-top:4px;">
            <span class="altura">${est.altura.toFixed(2)}</span>
            <span style="font-size:0.8rem; color:var(--txt-dim);">mts</span>
            <span style="margin-left:auto; font-size:0.8rem;">${flecha} ${est.tendencia}</span>
          </div>
        `;
        card.onclick = () => {
          map.flyTo([est.lat, est.lng], 11);
          if (window.innerWidth <= 768) toggleSidebar();
        };
        listaEl.appendChild(card);

        const customIcon = L.divIcon({
          className: 'custom-pin',
          html: `<div style="background:rgba(30,30,30,0.9); border:2px solid ${color}; color:${color}; padding:2px 6px; border-radius:8px; font-weight:bold; font-size:11px;">${est.altura.toFixed(2)}m ${flecha}</div>`,
          iconSize: [60, 25]
        });

        const marker = L.marker([est.lat, est.lng], { icon: customIcon }).addTo(map);
        marker.bindPopup(`<b>${est.nombre}</b><br>Río: ${est.rio}<br>Altura: ${est.altura.toFixed(2)}m<br>Alerta: ${est.alerta}m`);
        markersEstaciones.push(marker);
      });
    }

    function filtrar(rio, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (rio === 'todos') renderEstaciones(estacionesData);
      else renderEstaciones(estacionesData.filter(e => e.rio.toLowerCase().includes(rio.toLowerCase())));
    }

    window.onresize = actualizarTextoBoton;
    window.onload = initApp;
  </script>
</body>
</html>
